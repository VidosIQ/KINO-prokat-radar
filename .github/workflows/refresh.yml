name: Update cinema dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC: 07:23, 13:23, 19:23 Moscow; detect reports every day.
    - cron: '23 4,10,16 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cinema-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate collectors
        run: python -m unittest discover -s tests -v
      - name: Check published reports and ratings
        run: |
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            python scripts/refresh.py
          else
            python scripts/refresh.py --force
          fi
      - name: Validate page data and Excel
        run: python scripts/validate.py
      - name: Save verified data
        id: changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json data/last-check.json site
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified cinema data'
            git push
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != 'schedule' ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Package page
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Preserve source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence-${{ github.run_id }}
          path: |
            data/evidence/
            data/last-check.json
          retention-days: 14
  deploy:
    needs: collect
    if: needs.collect.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
